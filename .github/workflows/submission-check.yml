name: Submission Check

# pull_request_target so the job can comment on and label PRs from forks.
# Only the base branch is checked out; PR code is never run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'README.md'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true
        type: number
      dry_run:
        description: 'Print results to the log instead of commenting and labeling'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check linked repositories
        run: ./.github/workflows/check_submission.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
