name: Submission Check

# pull_request_target so the job can comment on and label PRs from forks.
# Only the base branch is checked out; PR code is never run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'README.md'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check linked repositories
        run: ./.github/workflows/check_submission.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
